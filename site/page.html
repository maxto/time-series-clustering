<!DOCTYPE html>
<html lang="en" data-build="{{build}}" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{{meta}}
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}assets/katex/katex.min.css">
<link rel="stylesheet" href="{{root}}assets/theme.css">
<script src="{{root}}assets/theme.js"></script>
</head>
<body>
<header class="bar"><div class="in"><a class="brand" href="{{root}}index.html"><span class="dot"></span>{{site}}</a><nav><span class="where">{{module}}</span><span>{{position}}</span><button class="theme" type="button" aria-label="Switch colour theme">◐</button></nav></div><div class="prog"><i style="width:{{progress}}%"></i></div></header>
<div class="wrap"><main>
<p class="kicker">{{kicker}}</p>
<h1>{{title}}</h1>
<p class="lede">{{lede}}</p>
<div class="oneline">{{oneline}}</div>
<div class="lesson-body">
{{body}}
</div>
{{specimens}}
<div class="mistake">{{mistake}}</div>
</main>
<aside>
{{notes}}
</aside>
<nav class="pager" aria-label="Lessons">{{pager}}</nav></div>
</body>
</html>
