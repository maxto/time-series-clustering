[project]
name = "tsc"
version = "0.1.0"
description = "Reference code for the time series clustering mini-course"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy~=2.3.5",
    "scipy~=1.17.1",
    "markdown-it-py~=4.2.0",
    "mdit-py-plugins~=0.6.1",
]

[dependency-groups]
dev = [
    "pytest",
    "dtw-python",
    "scikit-learn",
    "aeon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/python/tsc"]

[tool.pytest.ini_options]
testpaths = ["code/python/tests", "tests"]
