<circle class="fill-ink" cx="46.9" cy="33.6" r="5"/>
<circle class="fill-ink" cx="56.6" cy="29.1" r="5"/>
<circle class="fill-accent" cx="210.7" cy="238" r="5"/>
<circle class="fill-accent" cx="265.3" cy="208.3" r="5"/>
<circle class="fill-accent" cx="249.6" cy="208.2" r="5"/>
<circle class="fill-accent" cx="321.3" cy="209.6" r="5"/>
<circle class="fill-accent" cx="286.8" cy="206.6" r="5"/>
<circle class="fill-accent" cx="299" cy="219" r="5"/>
<text class="t-sm t-mono" x="34" y="256">0</text>
<text class="t-sm t-mono end" x="350" y="256">distance to shapelet A</text>
<text class="t-sm t-mono end" x="28" y="238">0</text>
<text class="t-sm t-mono end" x="342" y="26">distance to shapelet B</text>
</svg>
