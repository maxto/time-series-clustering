[[sector.question]]
id = "same-dates"
text = "Which assets move together on the same dates?"
starts = ["Correlation", "Agglomerative"]

[[sector.question.fit]]
item = "Correlation"
mark = "good"
reason = "Co-movement on the same dates is the classic question. Mantegna (1999) builds a hierarchy of stocks from return correlations."

[[sector.question.fit]]
item = "Agglomerative"
mark = "good"
reason = "Hierarchies of assets come from linkage on a correlation distance."

[[sector.question.fit]]
item = "k-medoids"
mark = "good"
reason = "Works directly from a correlation distance matrix."

[[sector.question.fit]]
item = "DTW"
mark = "avoid"
reason = "Warping pairs different dates and destroys the simultaneity the question is about."

[[sector.question.fit]]
item = "LCSS"
mark = "avoid"
reason = "An elastic match pairs different dates."

[[sector.question.fit]]
item = "SBD"
mark = "avoid"
reason = "The best lag answers a lead-lag question, not co-movement."

[[sector.question.fit]]
item = "Cross-correlation"
mark = "avoid"
reason = "The best lag answers a lead-lag question, not co-movement."

[[sector.question.fit]]
item = "Euclidean"
mark = "avoid"
reason = "On raw prices the price level dominates. Compare returns."

[[sector.question]]
id = "dynamics"
text = "Which assets have similar dynamics?"
starts = ["ACF / PACF", "AR models"]

[[sector.question.fit]]
item = "ACF / PACF"
mark = "good"
reason = "Compare dependence structure, for example of returns or squared returns."

[[sector.question.fit]]
item = "AR models"
mark = "good"
reason = "Compare dynamics rather than paths."

[[sector.question.fit]]
item = "Ordinal patterns"
mark = "good"
reason = "Unchanged by the scale of the returns."

